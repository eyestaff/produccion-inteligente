name = "produccion-inteligente"
main = "index.ts"
compatibility_date = "2026-08-04"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "produccion_inteligente_db"
migrations_dir = "db/migrations"

[ai]
binding = "AI"

[env.production]
name = "produccion-inteligente"
vars = { PROJECT_NAME = "Producción inteligente", APP_URL = "https://produccion-inteligente.smart-group.workers.dev" }

[env.production.ai]
binding = "AI"

[[env.production.d1_databases]]
binding = "DB"
database_name = "produccion_inteligente_db"
migrations_dir = "db/migrations"

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "produccion-inteligente-assets"

[assets]
directory = "../frontend/dist"
binding = "ASSETS_FETCH"
